name: G0 baseline checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts-and-workspace:
    name: G0 contracts and frozen install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Verify pinned pnpm version
        run: |
          corepack enable
          corepack pnpm --version
      - name: Install from committed lockfile only
        run: corepack pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify Node contract smoke tests
        run: npm test
      - name: Verify JSON Schema fixtures
        run: |
          python -m pip install -r contracts/tests/requirements.txt
          python -m unittest discover -s contracts/tests -p 'test_*.py' -v
      - name: Run implemented workspace tests
        run: corepack pnpm -r --if-present test
      - name: Build implemented workspace packages
        run: corepack pnpm -r --if-present build
      - name: Verify installation did not rewrite lockfile
        run: git diff --exit-code -- pnpm-lock.yaml
